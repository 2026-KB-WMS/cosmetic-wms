plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.epages.restdocs-api-spec" version "0.19.4"
}

group = 'com.kb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
}

// Docker 29+는 API 1.40 미만 클라이언트를 거부한다. 1.21.0 이하는 접속에 실패하므로 1.21.4 이상을 유지한다
ext['testcontainers.version'] = '1.21.4'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.retry:spring-retry'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'

    testImplementation 'org.springframework.security:spring-security-test'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    testImplementation 'org.testcontainers:mysql'
}

ext {
    snippetsDir = file('build/generated-snippets')
}

test {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

openapi3 {
    server = 'http://localhost:8080'
    title = 'Cosmetic WMS REST API 명세서'
    description = '화장품 도메인 특수성을 반영한 WMS의 테스트 기반 Swagger 명세서입니다.'
    version = '0.0.1'
    format = 'yaml'
}

tasks.register('copyOasToStatic', Copy) {
    dependsOn(tasks.openapi3)

    from("build/api-spec")
    into("src/main/resources/static/docs")
}

bootJar {
    dependsOn 'copyOasToStatic'
}

build {
    dependsOn 'copyOasToStatic'
}