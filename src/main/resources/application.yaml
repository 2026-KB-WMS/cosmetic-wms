spring:
  application:
    name: cosmetic_wms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cosmetic_wms?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show_sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

bootstrap:
  headquarters:
    login-id: ${HQ_LOGIN_ID:}
    password: ${HQ_PASSWORD:}
    member-name: ${HQ_MEMBER_NAME:}
    email: ${HQ_EMAIL:}
    phone-number: ${HQ_PHONE_NUMBER:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /docs/openapi3.yaml

geocoding:
  kakao:
    base-url: https://dapi.kakao.com
    api-key: ${KAKAO_REST_API_KEY:}

routing:
  kakao:
    base-url: https://apis-navi.kakaomobility.com
