spring:
  application:
    name: cosmetic_wms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cosmetic_wms?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show_sql: true
    properties:
      hibernate:
        format_sql: true

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

bootstrap:
  headquarters:
    login-id: ${HQ_LOGIN_ID:}
    password: ${HQ_PASSWORD:}
    member-name: ${HQ_MEMBER_NAME:}
    email: ${HQ_EMAIL:}
    phone-number: ${HQ_PHONE_NUMBER:}

inventory:
  shelf-life:
    # 잔여 유통기한이 이 일수 이하인 재고는 출고하지 않는다 (7이면 잔여 7일은 제외, 8일부터 출고 가능)
    min-remaining-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /docs/openapi3.yaml

geocoding:
  kakao:
    base-url: https://dapi.kakao.com
    api-key: ${KAKAO_REST_API_KEY:}

routing:
  kakao:
    base-url: https://apis-navi.kakaomobility.com
