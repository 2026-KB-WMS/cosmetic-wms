spring:
  application:
    name: cosmetic_wms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cosmetic_wms?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "1234"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show_sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

    security:
      user:
        name: user
        password: password

    springdoc:
      api-docs:
        enabled: false
      swagger-ui:
        url: /docs/openapi3.yaml
