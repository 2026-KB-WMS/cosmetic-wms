spring:
  jpa:
    show_sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      pool-name: HikariPool-WMS
      maximum-pool-size: 50
      minimum-idle: 10

logging:
  level:
    root: WARN
    com.kb.cosmetic_wms: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari.pool.HikariPool: DEBUG
