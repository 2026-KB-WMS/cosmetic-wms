server:
  port: 8082

spring:
  application:
    name: service-auth

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "1234"

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show_sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  private-key-path: keys/private.pem
  access-token-expiration-ms: 300000
  refresh-token-expiration-ms: 1209600000
  issuer: cosmetic_wms
  kid: cosmetic_wms_rsa_v1
  filter:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /docs/openapi3.yaml